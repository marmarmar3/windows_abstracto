
<html lang="es">
<body style="background-color: #e8f5e9; margin: 0; padding: 0;">
<script>
    
var lol;

function iniciar_canvas(ancho, alto) {
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    canvas.width = ancho;
    canvas.height = alto;
    canvas.style.backgroundColor = "#e8f5e9";
    lol = canvas.getContext("2d");
}
    
    
       /* rectangulo x1, y1, esquina superior
 ancho, alto del rectángulo, rojo, verde, azul, colores
 trans, transparencia (valor entre 0 y 1)*/

function rectangulo(x1, y1, ancho, alto, rojo, verde, azul, trans, tipo) {
    if (tipo == 1) {
        lol.fillStyle = 'rgba(' + Math.floor(rojo) + ',' + Math.floor(verde) + ',' + Math.floor(azul) + ',' + trans + ')';
        lol.fillRect(x1, y1, ancho, alto);
    } else
    {
        lol.strokeStyle = 'rgba(' + Math.floor(rojo) + ',' + Math.floor(verde) + ',' + Math.floor(azul) + ',' + trans + ')';
        lol.lineWidth = 3;
        lol.strokeRect(x1, y1, ancho, alto);
    }
}
    
    

function circulo(x, y, radio, rojo, verde, azul, trans) {
    lol.beginPath();
    lol.arc(x, y, radio, 0, 2 * Math.PI);
    lol.fillStyle = 'rgba(' + rojo + ',' + verde + ',' + azul + ',' + trans + ')';
    lol.fill();
}

    
iniciar_canvas(1000, 1000);

/*circulito*/

</script>
